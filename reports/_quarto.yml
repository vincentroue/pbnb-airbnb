format:
  html:
    theme: [cosmo, config/theme-html.scss]
    include-after-body: config/scrollspy-fix.html
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "Sur cette page"
    number-sections: true
    smooth-scroll: true
    code-fold: true
    code-summary: "Code"
    grid:
      body-width: 950px
      sidebar-width: 0px
      margin-width: 350px
      gutter-width: 3rem
    fig-width: 10
    fig-height: 6
    fig-align: center
    mainfont: "Inter, system-ui, sans-serif"
    # PAS de title-block-banner — titre dans le flux body (aligné SCSS)

execute:
  python: C:/ScoopApps/apps/python/current/python.exe
  warning: false
  message: false
  echo: false

lang: fr
