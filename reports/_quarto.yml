project:
  type: website
  output-dir: _output
  render:
    - rpt-pbnb-synth-monde-260214.qmd
    - rpt-pbnb-synth-europe-260214.qmd
    - rpt-pbnb-rapport-ALL-260207.qmd
    - rpt-pbnb-synth-franceparis-260217.qmd
    - rpt-pbnb-rapport-franceparis-260218.qmd
    - rpt-pbnb-edanbk-ALL-260215.qmd
    - rpt-pbnb-edanbk-acpfocus-260222.qmd
    - rpt-pbnb-methnbk-acp-260215.qmd
    - rpt-pbnb-dash-ALL-260222.qmd
    - rpt-pbnb-dash-franceparis-260218.qmd

website:
  title: "Airbnb — Analyse des marchés"
  search: false
  navbar:
    background: "#0a3d5c"
    left:
      - text: "Analyse Monde"
        menu:
          - text: "Rapport d'analyse mondiale"
            href: rpt-pbnb-rapport-ALL-260207.qmd
          - text: "---"
          - text: "Synthèse — 75 villes monde"
            href: rpt-pbnb-synth-monde-260214.qmd
          - text: "Synthèse — 37 marchés Europe"
            href: rpt-pbnb-synth-europe-260214.qmd
      - text: "Analyse France"
        menu:
          - text: "Rapport France — Paris, Lyon, Bordeaux"
            href: rpt-pbnb-rapport-franceparis-260218.qmd
          - text: "---"
          - text: "Synthèse France"
            href: rpt-pbnb-synth-franceparis-260217.qmd
      - text: "Notebook & Méthodes"
        menu:
          - text: "Notebook EDA — 75 villes"
            href: rpt-pbnb-edanbk-ALL-260215.qmd
          - text: "ACP & Clustering — Focus"
            href: rpt-pbnb-edanbk-acpfocus-260222.qmd
          - text: "---"
          - text: "Annexe méthodologique"
            href: rpt-pbnb-methnbk-acp-260215.qmd
    right:
      - text: "Dashboard Monde"
        href: rpt-pbnb-dash-ALL-260222.qmd
        icon: globe
      - text: "Dashboard France"
        href: rpt-pbnb-dash-franceparis-260218.qmd
        icon: map

format:
  html:
    theme: [cosmo, config/theme-pbnb-v2.scss]
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "Sur cette page"
    number-sections: true
    smooth-scroll: true
    code-fold: true
    code-summary: "Code"
    grid:
      body-width: 950px
      sidebar-width: 0px
      margin-width: 350px
      gutter-width: 3rem
    fig-width: 10
    fig-height: 6
    fig-align: center
    mainfont: "Inter, system-ui, sans-serif"

execute:
  python: C:/ScoopApps/apps/python/current/python.exe
  warning: false
  message: false
  echo: false

lang: fr
