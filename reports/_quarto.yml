format:
  html:
    theme: [cosmo, config/theme-pbnb-v2.scss]
    toc: true
    embed-resources: false
    title-block-banner: "#1690bd"        # new conv 260612
    title-block-banner-color: white
    fig-dpi: 250
    toc-depth: 3
    toc-location: right
    toc-title: "Sur cette page"
    number-sections: true
    smooth-scroll: true
    code-fold: true
    code-summary: "Code"
    grid:
      body-width: 1050px
      sidebar-width: 0px
      margin-width: 350px
      gutter-width: 3rem
    fig-width: 10
    fig-height: 6
    fig-align: center
    mainfont: "Inter, system-ui, sans-serif"

execute:
  python: C:/Users/vince/AppData/Local/Programs/Python/Python312/python.exe
  warning: false
  message: false
  echo: false

lang: fr
date-format: "YYYY"
